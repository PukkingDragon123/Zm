<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#100d0a" />
<title>ZUMO — STREET SCRAPPERS</title>
<meta name="description" content="A post-apocalyptic street game: build junk battle-bots and brawl your way up the block." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23100d0a'/%3E%3Crect x='4' y='5' width='8' height='6' fill='%23a6552f'/%3E%3Crect x='5' y='7' width='2' height='2' fill='%23e8a33d'/%3E%3Crect x='9' y='7' width='2' height='2' fill='%23e8a33d'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<canvas id="stage"></canvas>

<!-- gritty post overlays -->
<div id="fog"></div>
<div id="grain"></div>
<div id="vig"></div>
<div id="flash"></div>

<div id="ui">

  <!-- BOOT -->
  <section class="screen" data-screen="boot">
    <div class="boot">
      <div class="boot-title">ZUMO</div>
      <div class="boot-sub">STREET SCRAPPERS</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-log" id="bootLog"></div>
    </div>
  </section>

  <!-- TITLE -->
  <section class="screen" data-screen="title">
    <div class="title">
      <div class="title-logo">ZUMO</div>
      <div class="title-word">STREET SCRAPPERS</div>
      <p class="title-sub" id="titleSub"></p>
      <div class="title-menu">
        <button class="pbtn big" data-act="play">START</button>
        <button class="pbtn" data-act="how">HOW TO PLAY</button>
        <button class="pbtn" data-act="reset">WIPE SAVE</button>
      </div>
      <div class="title-foot">move: A / D &nbsp; enter: W &nbsp; a full pad shows on touch</div>
    </div>
  </section>

  <!-- WORLD (side-scroll overworld; canvas does the work) -->
  <section class="screen" data-screen="world">
    <div class="world-hud">
      <div class="money" id="worldMoney">0</div>
      <button class="pbtn tiny" data-act="settings">MENU</button>
    </div>
    <div class="interact" id="interactPrompt"></div>
  </section>

  <!-- WORKBENCH (canvas drag-build) -->
  <section class="screen" data-screen="workbench">
    <div class="bench-hud">
      <button class="pbtn tiny" data-act="world">LEAVE</button>
      <div class="bench-name-wrap">
        <input id="benchName" class="bench-name" maxlength="14" spellcheck="false" />
      </div>
      <div class="bench-readout" id="benchReadout"></div>
    </div>
    <div class="bench-tools" id="benchTools"></div>
  </section>

  <!-- TOY SHOP -->
  <section class="screen" data-screen="shop">
    <div class="interior">
      <div class="int-head"><button class="pbtn tiny" data-act="world">LEAVE</button><h2>TANAKA'S TOY &amp; SCRAP</h2><div class="int-money" id="shopMoney">0</div></div>
      <div class="int-npc" id="shopNpc"></div>
      <div class="shop-filter" id="shopFilter"></div>
      <div class="shop-list" id="shopList"></div>
    </div>
  </section>

  <!-- RAMEN -->
  <section class="screen" data-screen="ramen">
    <div class="interior">
      <div class="int-head"><button class="pbtn tiny" data-act="world">LEAVE</button><h2>OL' BOY RAMEN</h2><div class="int-money" id="ramenMoney">0</div></div>
      <div class="int-npc" id="ramenNpc"></div>
      <div class="ramen-list" id="ramenList"></div>
    </div>
  </section>

  <!-- JOB BOARD -->
  <section class="screen" data-screen="quests">
    <div class="interior">
      <div class="int-head"><button class="pbtn tiny" data-act="world">LEAVE</button><h2>THE JOB BOARD</h2><div class="int-money" id="qMoney">0</div></div>
      <div class="quests" id="questList"></div>
    </div>
  </section>

  <!-- SCRAP ALLEY -->
  <section class="screen" data-screen="scavenge">
    <div class="interior">
      <div class="int-head"><button class="pbtn tiny" data-act="world">LEAVE</button><h2>SCRAP ALLEY</h2>
        <div class="int-money"><span id="scvDigs">0</span> digs</div></div>
      <div class="scv-hint" id="scvHint"></div>
      <div class="scv-grid" id="scvGrid"></div>
      <div class="scv-actions">
        <button class="pbtn" data-act="scvNew">NEW ALLEY (<span id="scvCost">40</span>)</button>
        <div class="scv-haul" id="scvHaul"></div>
      </div>
    </div>
  </section>

  <!-- ARENA / LADDER -->
  <section class="screen" data-screen="ladder">
    <div class="interior">
      <div class="int-head"><button class="pbtn tiny" data-act="world">LEAVE</button><h2>THE PIT — PICK A SCRAP</h2><div class="int-money" id="ladMoney">0</div></div>
      <div class="ladder" id="ladderList"></div>
    </div>
  </section>

  <!-- BATTLE (side-scroll; canvas + pad) -->
  <section class="screen" data-screen="battle">
    <div class="battle-hud">
      <div class="bhp left"><div class="bhp-name" id="bhpNameL">YOU</div><div class="bhp-bar"><i id="bhpL"></i></div><div class="bhp-en"><i id="benL"></i></div></div>
      <div class="btimer" id="bTimer"></div>
      <div class="bhp right"><div class="bhp-name" id="bhpNameR">RIVAL</div><div class="bhp-bar"><i id="bhpR"></i></div><div class="bhp-en"><i id="benR"></i></div></div>
    </div>
    <div class="announce" id="announce"></div>
  </section>

  <!-- RESULT -->
  <section class="screen" data-screen="result">
    <div class="result">
      <div class="result-band" id="resultBand"></div>
      <div class="result-body" id="resultBody"></div>
      <div class="result-cta">
        <button class="pbtn big" data-act="rematch">REMATCH</button>
        <button class="pbtn" data-act="ladder">THE PIT</button>
        <button class="pbtn" data-act="world">STREET</button>
      </div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" data-screen="settings">
    <div class="panel">
      <h2>MENU</h2>
      <label class="set-row"><span>MUSIC</span><input type="range" id="setMusic" min="0" max="100"></label>
      <label class="set-row"><span>SFX</span><input type="range" id="setSfx" min="0" max="100"></label>
      <label class="set-row"><span>SHAKE</span><input type="checkbox" id="setShake"></label>
      <label class="set-row"><span>GRAIN</span><input type="checkbox" id="setCrt"></label>
      <label class="set-row"><span>DUST</span><input type="checkbox" id="setRain"></label>
      <div class="set-cta"><button class="pbtn" data-act="closeMenu">BACK</button></div>
    </div>
  </section>

  <!-- HOW -->
  <section class="screen" data-screen="how">
    <div class="panel">
      <h2>HOW TO PLAY</h2>
      <div class="how" id="howGrid"></div>
      <button class="pbtn big" data-act="title">OK</button>
    </div>
  </section>

</div>

<!-- on-screen controller (populated by controls.js) -->
<div id="pad"></div>

<div id="toasts"></div>
<div id="tip"></div>

<script src="js/util.js"></script>
<script src="js/assets.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/state.js"></script>
<script src="js/bot.js"></script>
<script src="js/fx.js"></script>
<script src="js/render.js"></script>
<script src="js/controls.js"></script>
<script src="js/ui.js"></script>
<script src="js/workbench.js"></script>
<script src="js/scavenge.js"></script>
<script src="js/shop.js"></script>
<script src="js/ramen.js"></script>
<script src="js/quests.js"></script>
<script src="js/ladder.js"></script>
<script src="js/overworld.js"></script>
<script src="js/combat.js"></script>
<script src="js/game.js"></script>
</body>
</html>
